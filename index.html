<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Rhythm Practice</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151c31;
      --panel2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --event: #166534;
      --now: #f59e0b;
      --line: #475569;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: linear-gradient(180deg, #0b1020, #111827);
      color: var(--text);
    }

    body {
      min-height: 100svh;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding:
        max(12px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    h1 {
      font-size: clamp(1.25rem, 5vw, 1.6rem);
      margin: 0 0 3px;
    }

    .sub {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 12px;
    }

    .panel {
      width: 100%;
      min-width: 0;
      background: rgba(21, 28, 49, .96);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 16px;
      padding: 13px;
      box-shadow: 0 10px 28px rgba(0,0,0,.2);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: .86rem;
    }

    .tempo-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
    }

    input[type="range"] {
      width: 100%;
      min-width: 0;
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      font-size: 1rem;
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      text-align: center;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 750;
      color: white;
      background: #2563eb;
      touch-action: manipulation;
    }

    button.stop { background: #b91c1c; }
    button:disabled { opacity: .42; }

    .beat {
      font-size: clamp(2rem, 10vw, 2.8rem);
      font-weight: 850;
      text-align: center;
      line-height: 1;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .board {
      width: 100%;
      min-width: 0;
    }

    .ruler,
    .part-row {
      display: grid;
      grid-template-columns: clamp(52px, 18vw, 78px) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
    }

    .ruler {
      margin-bottom: 6px;
    }

    .ruler-label {
      color: var(--muted);
      font-size: .72rem;
    }

    .beat-ruler {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      text-align: center;
      color: #cbd5e1;
      font-size: .72rem;
      font-weight: 700;
    }

    .part-row + .part-row {
      margin-top: 7px;
    }

    .part-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e2e8f0;
      font-weight: 750;
      font-size: clamp(.72rem, 3.2vw, .9rem);
    }

    .steps {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(24, minmax(0, 1fr));
      gap: 2px;
    }

    .cell {
      min-width: 0;
      height: clamp(13px, 4.4vw, 23px);
      border-radius: 3px;
      background: #263248;
      border: 1px solid rgba(255,255,255,.04);
      transition: background .035s linear, transform .035s linear;
    }

    .cell:nth-child(6n + 1) {
      box-shadow: inset 2px 0 0 var(--line);
    }

    .cell.event {
      background: var(--event);
    }

    .cell.now {
      outline: 2px solid var(--now);
      outline-offset: -1px;
      transform: scaleY(1.12);
      z-index: 1;
    }

    .cell.event.now {
      background: var(--now);
    }

    .legend {
      margin-top: 11px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.55;
    }

    .sync-note {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: .72rem;
    }

    @media (max-width: 360px) {
      .panel { padding: 10px; }
      .part-label { font-size: .68rem; }
      .steps { gap: 1px; }
      .cell { border-radius: 2px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Rhythm Practice</h1>
    <div class="sub">口・右手・左手・足の独立練習</div>

    <section class="panel controls">
      <div>
        <div class="status">
          <span>BPM</span>
          <span id="bpmLabel">60</span>
        </div>
        <div class="tempo-row">
          <input id="bpmRange" type="range" min="40" max="180" value="60" />
          <input id="bpmNumber" type="number" min="40" max="180" value="60" />
        </div>
      </div>

      <div class="buttons">
        <button id="startBtn">▶ Start</button>
        <button id="stopBtn" class="stop" disabled>■ Stop</button>
      </div>

      <div class="beat" id="beatDisplay">—</div>
      <div class="status">
        <span id="stateText">停止中</span>
        <span>4/4 ・ 1小節ループ</span>
      </div>
    </section>

    <section class="panel">
      <div class="board" id="board">
        <div class="ruler">
          <div class="ruler-label">PART</div>
          <div class="beat-ruler">
            <span>1</span><span>2</span><span>3</span><span>4</span>
          </div>
        </div>
      </div>

      <div class="legend">
        Voice = 4分 ／ R.Hand = 8分 ／ L.Hand = 2拍3連 ／ Foot = 2分
      </div>
      <div class="sync-note">表示は音声と同じ AudioContext の時刻を参照して追従します。</div>
    </section>
  </main>

  <script>
    const STEPS_PER_BEAT = 6;
    const STEPS_PER_BAR = 24;

    const parts = [
      { key: "voice", label: "Voice", freq: 920, gain: 0.095, duration: 0.030, events: [0, 6, 12, 18] },
      { key: "right", label: "R.Hand", freq: 690, gain: 0.085, duration: 0.026, events: [0, 3, 6, 9, 12, 15, 18, 21] },
      { key: "left", label: "L.Hand", freq: 460, gain: 0.085, duration: 0.032, events: [0, 4, 8, 12, 16, 20] },
      { key: "foot", label: "Foot", freq: 150, gain: 0.15, duration: 0.060, events: [0, 12] }
    ];

    const bpmRange = document.getElementById("bpmRange");
    const bpmNumber = document.getElementById("bpmNumber");
    const bpmLabel = document.getElementById("bpmLabel");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const beatDisplay = document.getElementById("beatDisplay");
    const stateText = document.getElementById("stateText");
    const board = document.getElementById("board");

    let audioCtx = null;
    let running = false;
    let nextStep = 0;
    let nextNoteTime = 0;
    let schedulerId = null;
    let rafId = null;

    // 音の予約時刻と表示を同じ時計で同期するための短いキュー
    const visualQueue = [];
    let shownStep = -1;

    const lookaheadMs = 20;
    const scheduleAheadSec = 0.10;

    function clampBpm(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return 60;
      return Math.min(180, Math.max(40, Math.round(n)));
    }

    function setBpm(value) {
      const bpm = clampBpm(value);
      bpmRange.value = bpm;
      bpmNumber.value = bpm;
      bpmLabel.textContent = bpm;
    }

    bpmRange.addEventListener("input", e => setBpm(e.target.value));
    bpmNumber.addEventListener("input", e => setBpm(e.target.value));

    function buildBoard() {
      for (const part of parts) {
        const row = document.createElement("div");
        row.className = "part-row";

        const label = document.createElement("div");
        label.className = "part-label";
        label.textContent = part.label;

        const steps = document.createElement("div");
        steps.className = "steps";

        for (let step = 0; step < STEPS_PER_BAR; step++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (part.events.includes(step)) cell.classList.add("event");
          cell.dataset.step = String(step);
          cell.dataset.part = part.key;
          steps.appendChild(cell);
        }

        row.appendChild(label);
        row.appendChild(steps);
        board.appendChild(row);
      }
    }

    function secondsPerStep() {
      return (60 / clampBpm(bpmNumber.value)) / STEPS_PER_BEAT;
    }

    function makeClick(time, part) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = part.key === "foot" ? "sine" : "triangle";
      osc.frequency.setValueAtTime(part.freq, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(part.gain, time + 0.0025);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + part.duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + part.duration + 0.012);
    }

    function scheduleStep(step, time) {
      for (const part of parts) {
        if (part.events.includes(step)) {
          makeClick(time, part);
        }
      }
      visualQueue.push({ step, time });
    }

    function scheduler() {
      if (!running || !audioCtx) return;

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadSec) {
        scheduleStep(nextStep, nextNoteTime);
        nextNoteTime += secondsPerStep();
        nextStep = (nextStep + 1) % STEPS_PER_BAR;
      }
    }

    function renderStep(step) {
      if (step === shownStep) return;

      document.querySelectorAll(".cell.now").forEach(el => el.classList.remove("now"));
      document.querySelectorAll('[data-step="' + step + '"]').forEach(el => el.classList.add("now"));

      beatDisplay.textContent = String(Math.floor(step / STEPS_PER_BEAT) + 1);
      shownStep = step;
    }

    function visualLoop() {
      if (!running || !audioCtx) return;

      const now = audioCtx.currentTime;

      // 予約された音の実時刻を越えた時点でのみ画面を進める
      while (visualQueue.length && visualQueue[0].time <= now) {
        const item = visualQueue.shift();
        renderStep(item.step);
      }

      rafId = requestAnimationFrame(visualLoop);
    }

    function clearVisuals() {
      visualQueue.length = 0;
      shownStep = -1;
      document.querySelectorAll(".cell.now").forEach(el => el.classList.remove("now"));
      beatDisplay.textContent = "—";
    }

    async function start() {
      if (running) return;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          latencyHint: "interactive"
        });
      }

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      running = true;
      clearVisuals();

      nextStep = 0;
      nextNoteTime = audioCtx.currentTime + 0.08;

      startBtn.disabled = true;
      stopBtn.disabled = false;
      stateText.textContent = "再生中";

      scheduler();
      schedulerId = setInterval(scheduler, lookaheadMs);
      rafId = requestAnimationFrame(visualLoop);
    }

    function stop() {
      running = false;

      if (schedulerId !== null) {
        clearInterval(schedulerId);
        schedulerId = null;
      }

      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      startBtn.disabled = false;
      stopBtn.disabled = true;
      stateText.textContent = "停止中";
      clearVisuals();
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);

    buildBoard();
    setBpm(60);
  </script>
</body>
</html>
