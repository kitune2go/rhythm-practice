name: Pattern schema validation

on:
  pull_request:
    paths:
      - "index.html"
      - "pattern-model.mjs"
      - "tests/**"
      - ".github/workflows/pattern-schema.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/pattern-schema.test.mjs
